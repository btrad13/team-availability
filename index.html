<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --panel: #14171f;
  --panel-2: #181c25;
  --line: #262b38;
  --line-soft: #1d212b;
  --ink: #e6e8ee;
  --muted: #8a91a2;
  --muted-2: #5c6373;
  --accent: #e8ff47;
  --blue: #47c8ff;
  --green: #47ffb2;
  --danger: #ff5d5d;
  --mono: 'DM Mono', ui-monospace, monospace;
  --ui: 'Barlow', system-ui, sans-serif;
  --cond: 'Barlow Semi Condensed', 'Barlow', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 44px 44px;
  background-position: -1px -1px;
}

::selection { background: var(--accent); color: #0d0f14; }

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 22px 80px;
}

/* ---------- Header ---------- */
.masthead {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 22px;
  border: 1px solid var(--line);
  border-top: none;
  background: var(--panel);
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 22px;
  border-right: 1px solid var(--line);
}
.brand .mark {
  width: 26px; height: 26px;
  background: var(--accent);
  display: grid; place-items: center;
  transform: rotate(45deg);
  flex: none;
}
.brand .mark span {
  transform: rotate(-45deg);
  font-family: var(--cond);
  font-weight: 700;
  font-size: 15px;
  color: #0d0f14;
}
.brand .titles { line-height: 1; }
.brand h1 {
  font-family: var(--cond);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.brand .sub {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted-2);
  letter-spacing: 0.14em;
  margin-top: 5px;
  text-transform: uppercase;
  white-space: nowrap;
}

.tabs { display: flex; }
.tab {
  appearance: none;
  border: none;
  border-left: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-family: var(--cond);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0 26px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background .12s, color .12s;
}
.tab .idx {
  font-family: var(--mono);
  font-size: 11px;
  opacity: .55;
}
.tab:hover { color: var(--ink); background: var(--panel-2); }
.tab.active {
  background: var(--accent);
  color: #0d0f14;
}
.tab.active .idx { opacity: .7; }

/* ---------- Panels / sections ---------- */
.pnl {
  border: 1px solid var(--line);
  background: var(--panel);
}
.mode { display: none; }
.mode.active { display: block; }

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.grid-2 > .pnl:first-child { border-right: none; }
@media (max-width: 820px) {
  .grid-2 { grid-template-columns: 1fr; }
  .grid-2 > .pnl:first-child { border-right: 1px solid var(--line); border-bottom: none; }
}

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.sec-head .lbl {
  font-family: var(--cond);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 12.5px;
  color: var(--ink);
  display: flex; align-items: center; gap: 9px;
}
.sec-head .lbl .dot {
  width: 7px; height: 7px; background: var(--accent); flex: none;
}
.sec-head .meta {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted-2);
  letter-spacing: 0.08em;
}
.sec-body { padding: 18px; }

/* ---------- Form fields ---------- */
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
label.cap {
  display: block;
  font-family: var(--cond);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 7px;
}
.row {
  display: grid;
  gap: 12px;
}
.row.two { grid-template-columns: 1fr 1fr; }
.row.add { grid-template-columns: 1fr 1fr auto; align-items: end; }
@media (max-width: 560px) {
  .row.two, .row.add { grid-template-columns: 1fr; }
}

input[type="text"], input[type="datetime-local"], select, textarea {
  width: 100%;
  background: #0c0e13;
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  transition: border-color .12s, box-shadow .12s;
}
input::placeholder, textarea::placeholder { color: var(--muted-2); }
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 16px, calc(100% - 11px) 16px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
  cursor: pointer;
}
input[type="datetime-local"] { font-family: var(--mono); font-size: 13px; }
input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.45); cursor: pointer; }
textarea {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.55;
  resize: vertical;
  min-height: 132px;
  white-space: pre;
  overflow-wrap: normal;
  overflow-x: auto;
}

/* ---------- Buttons ---------- */
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  font-family: var(--cond);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 12.5px;
  padding: 10px 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  transition: background .12s, border-color .12s, color .12s, transform .04s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--muted); background: #20242f; }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #0d0f14;
}
.btn.primary:hover { background: #f1ff7a; border-color: #f1ff7a; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn .plus { font-family: var(--mono); font-size: 14px; line-height: 1; }

/* ---------- Slot list ---------- */
.slot-list { display: flex; flex-direction: column; gap: 0; }
.slot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-bottom: none;
  background: #0f1219;
}
.slot:last-child { border-bottom: 1px solid var(--line); }
.slot .when { font-family: var(--mono); font-size: 12.5px; line-height: 1.45; }
.slot .when .day { color: var(--blue); }
.slot .when .rng { color: var(--ink); }
.slot .when .dur { color: var(--muted-2); margin-left: 8px; }
.slot .x {
  appearance: none; border: 1px solid var(--line); background: transparent;
  color: var(--muted); width: 26px; height: 26px; cursor: pointer; flex: none;
  font-family: var(--mono); font-size: 13px; line-height: 1;
  transition: color .12s, border-color .12s, background .12s;
  display: grid; place-items: center;
}
.slot .x:hover { color: var(--danger); border-color: var(--danger); }

.empty {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted-2);
  border: 1px dashed var(--line);
  padding: 20px 16px;
  text-align: center;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ---------- Share link ---------- */
.share-bar {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line); border-top: none;
  background: var(--panel); padding: 12px 14px;
}
.share-bar .share-url {
  flex: 1; font-family: var(--mono); font-size: 11px;
  color: var(--blue); background: #0c0e13; border: 1px solid var(--line);
  padding: 8px 10px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; min-width: 0;
}
.share-bar .share-url.placeholder { color: var(--muted-2); }
.btn.blue {
  background: var(--blue); border-color: var(--blue); color: #06222e;
}
.btn.blue:hover { filter: brightness(1.08); }

/* ---------- Controls bar (mode 2) ---------- */
.controls {
  display: grid;
  grid-template-columns: 1.1fr 1.4fr auto;
  gap: 0;
  align-items: stretch;
}
@media (max-width: 820px) { .controls { grid-template-columns: 1fr; } }
.ctrl {
  padding: 16px 18px;
  border-right: 1px solid var(--line);
}
.ctrl:last-child { border-right: none; }
@media (max-width: 820px) {
  .ctrl { border-right: none; border-bottom: 1px solid var(--line); }
}
.ctrl.act { display: flex; align-items: flex-end; }
.ctrl.act .btn { width: 100%; justify-content: center; padding: 13px 16px; }

.thresh-val {
  font-family: var(--mono); color: var(--accent); font-size: 13px;
}
.slider-wrap { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; background: var(--line); outline: none; cursor: pointer;
  border: none; padding: 0;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 22px; background: var(--accent); cursor: pointer;
  border: none;
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 22px; background: var(--accent); cursor: pointer; border: none; border-radius: 0;
}
.scale-ticks {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10px; color: var(--muted-2);
  margin-top: 7px;
}

/* riders grid */
.riders-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 700px) { .riders-grid { grid-template-columns: 1fr; } }
.rider-card .rc-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 7px;
}
.rider-card .rc-head .name {
  font-family: var(--cond); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.1em; font-size: 11px; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.status-pill {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
  padding: 2px 7px; border: 1px solid var(--line); color: var(--muted-2);
  text-transform: uppercase;
}
.status-pill.ok { color: var(--green); border-color: rgba(71,255,178,0.4); }
.status-pill.err { color: var(--danger); border-color: rgba(255,93,93,0.4); }
.rc-x {
  appearance: none; background: transparent; border: 1px solid var(--line);
  color: var(--muted); font-family: var(--mono); font-size: 11px;
  cursor: pointer; padding: 2px 8px;
}
.rc-x:hover { color: var(--danger); border-color: var(--danger); }
.rc-toolbar {
  display: flex; align-items: center; gap: 10px;
}

/* ---------- Results ---------- */
.results { margin-top: 22px; }
.day-group { margin-bottom: 20px; }
.day-head {
  display: flex; align-items: baseline; gap: 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px; margin-bottom: 10px;
}
.day-head .dow {
  font-family: var(--cond); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; font-size: 15px;
}
.day-head .date { font-family: var(--mono); font-size: 12px; color: var(--blue); white-space: nowrap; }
.day-head .count { font-family: var(--mono); font-size: 11px; color: var(--muted-2); margin-left: auto; white-space: nowrap; }

.overlap {
  display: flex; align-items: stretch; gap: 0;
  border: 1px solid var(--line);
  border-left: 3px solid var(--green);
  background: #0f1219;
  margin-bottom: 8px;
}
.overlap .time {
  padding: 12px 16px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 3px; justify-content: center;
  min-width: 188px;
}
.overlap .time .rng {
  font-family: var(--mono); font-size: 14px; color: var(--green); font-weight: 500;
}
.overlap .time .dur { font-family: var(--mono); font-size: 10.5px; color: var(--muted-2); letter-spacing: 0.06em; text-transform: uppercase; }
.overlap .riders {
  padding: 12px 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
}
.rider-chip {
  font-family: var(--cond); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; font-size: 12px;
  padding: 3px 9px; background: rgba(71,255,178,0.09);
  border: 1px solid rgba(71,255,178,0.28); color: var(--green);
}
.overlap .cnt {
  margin-left: auto; align-self: center; padding-right: 16px;
  font-family: var(--mono); font-size: 11px; color: var(--muted-2); white-space: nowrap;
}

.no-results {
  border: 1px dashed var(--line); padding: 30px 20px; text-align: center;
}
.no-results .big {
  font-family: var(--cond); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; font-size: 16px; color: var(--muted);
}
.no-results .small { font-family: var(--mono); font-size: 12px; color: var(--muted-2); margin-top: 8px; }

.hint {
  font-family: var(--mono); font-size: 11px; color: var(--muted-2);
  line-height: 1.5; letter-spacing: 0.02em;
}
.inline-note { color: var(--blue); }
.spacer { height: 22px; }

.mode-footer {
  display: flex; justify-content: flex-end; margin-top: 22px;
}
.btn.danger {
  background: transparent; border-color: var(--danger); color: var(--danger);
}
.btn.danger:hover { background: rgba(255,93,93,0.12); }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="brand">
      <div class="mark"><span>TA</span></div>
      <div class="titles">
        <h1>Team Availability</h1>
        <div class="sub">race-crew sync · utc-aware</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="enter" onclick="switchTab('enter')">
        <span class="idx">01</span> Enter My Availability
      </button>
      <button class="tab" data-tab="merge" onclick="switchTab('merge')">
        <span class="idx">02</span> Merge Team Availability
      </button>
    </nav>
  </header>

  <!-- ENTER MODE -->
  <div id="mode-enter" class="mode active">
    <div class="grid-2">
      <div class="pnl">
        <div class="sec-head">
          <div class="lbl"><span class="dot"></span>Rider Identity</div>
          <div class="meta" id="tz-abbrev-meta"></div>
        </div>
        <div class="sec-body">
          <div class="field">
            <label class="cap" for="rider-name">Rider name</label>
            <input id="rider-name" type="text" placeholder="e.g. MARGOT D.">
          </div>
          <div class="field">
            <label class="cap" for="rider-tz">Timezone (auto-detected)</label>
            <select id="rider-tz"></select>
            <div class="hint" style="margin-top:7px">
              Detected: <span class="inline-note" id="detected-tz-label"></span>. Override if traveling.
            </div>
          </div>

          <div class="spacer" style="height:6px"></div>
          <div class="sec-head" style="margin:0 -18px 16px;border-top:1px solid var(--line)">
            <div class="lbl"><span class="dot" style="background:var(--blue)"></span>Add Availability Slot</div>
          </div>

          <div class="row add">
            <div class="field" style="margin:0">
              <label class="cap">Start</label>
              <input type="datetime-local" id="slot-start">
            </div>
            <div class="field" style="margin:0">
              <label class="cap">End</label>
              <input type="datetime-local" id="slot-end">
            </div>
            <button class="btn primary" onclick="addSlot()">
              <span class="plus">+</span> Add
            </button>
          </div>
          <div id="slot-error"></div>
        </div>
      </div>

      <div class="pnl">
        <div class="sec-head">
          <div class="lbl"><span class="dot"></span>My Slots</div>
          <div class="meta" id="slot-count-meta">0 ADDED</div>
        </div>
        <div class="sec-body">
          <div id="slot-list"></div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="share-bar" style="border:1px solid var(--line)">
      <div class="share-url placeholder" id="share-url">Add your name and at least one slot to generate a share link</div>
      <button class="btn blue" id="share-btn" onclick="generateShareLink()" disabled>&#9656; Share Link</button>
    </div>
    <div class="mode-footer">
      <button class="btn danger" onclick="resetEnter()">&#10005; Reset All</button>
    </div>
  </div>

  <!-- MERGE MODE -->
  <div id="mode-merge" class="mode">
    <div class="pnl">
      <div class="controls">
        <div class="ctrl">
          <label class="cap" for="display-tz">Display timezone</label>
          <select id="display-tz"></select>
          <div class="hint" style="margin-top:8px">
            Results shown in <span class="inline-note" id="display-tz-abbrev"></span>.
          </div>
        </div>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="pnl">
      <div class="sec-head">
        <div class="lbl"><span class="dot"></span>Paste Rider Blocks</div>
        <div class="meta" id="rider-parse-meta">0 VALID / 0 TOTAL</div>
      </div>
      <div class="sec-body">
        <div class="riders-grid" id="riders-grid"></div>
        <div class="spacer" style="height:14px"></div>
        <button class="btn ghost" onclick="addRiderBlock()">
          <span class="plus">+</span> Add another rider
        </button>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="pnl">
      <div class="controls">
        <div class="ctrl">
          <label class="cap">
            Minimum riders &nbsp;<span class="thresh-val" id="threshold-val">2 / 2</span>
          </label>
          <div class="slider-wrap">
            <input type="range" id="threshold-slider" min="2" max="2" step="1" value="2">
          </div>
          <div class="scale-ticks"><span>2</span><span id="scale-max">ALL (2)</span></div>
        </div>
        <div class="ctrl act">
          <button class="btn primary" id="find-btn" onclick="findOverlaps()">&#9656; Find Overlaps</button>
        </div>
      </div>
    </div>

    <div id="merge-results"></div>
    <div class="mode-footer">
      <button class="btn danger" onclick="resetMerge()">&#10005; Reset All</button>
    </div>
  </div>
</div>

<script>
const TIMEZONES = [
  'Pacific/Honolulu','America/Los_Angeles','America/Vancouver','America/Denver',
  'America/Chicago','America/New_York','America/Toronto','America/Sao_Paulo',
  'Europe/London','Europe/Paris','Europe/Berlin','Europe/Amsterdam','Europe/Rome',
  'Europe/Stockholm','Africa/Johannesburg','Asia/Dubai','Asia/Kolkata',
  'Asia/Singapore','Asia/Hong_Kong','Asia/Shanghai','Asia/Tokyo','Asia/Seoul',
  'Australia/Perth','Australia/Adelaide','Australia/Brisbane','Australia/Sydney',
  'Australia/Melbourne','Pacific/Auckland','UTC'
];

let browserTz;
try { browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { browserTz = 'UTC'; }

function buildTzList() {
  const list = [browserTz];
  for (const tz of TIMEZONES) { if (tz !== browserTz) list.push(tz); }
  return list;
}

function getUtcOffsetMs(tz, date) {
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
  const parts = {};
  for (const p of fmt.formatToParts(date)) parts[p.type] = p.value;
  let hour = parseInt(parts.hour, 10);
  if (hour === 24) hour = 0;
  const asUTC = Date.UTC(
    parseInt(parts.year), parseInt(parts.month) - 1, parseInt(parts.day),
    hour, parseInt(parts.minute), parseInt(parts.second)
  );
  return asUTC - date.getTime();
}

function tzAbbrev(tz) {
  try {
    const dtf = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short', hour: '2-digit' });
    const p = dtf.formatToParts(new Date()).find(x => x.type === 'timeZoneName');
    return p ? p.value : '';
  } catch(e) { return ''; }
}

function utcOffsetLabel(tz) {
  const offsetMs = getUtcOffsetMs(tz, new Date());
  const totalMin = Math.round(offsetMs / 60000);
  const sign = totalMin >= 0 ? '+' : '-';
  const abs = Math.abs(totalMin);
  return 'UTC' + sign + String(Math.floor(abs / 60)).padStart(2, '0') + ':' + String(abs % 60).padStart(2, '0');
}

function populateSelect(sel) {
  const list = buildTzList();
  sel.innerHTML = '';
  for (const tz of list) {
    const opt = document.createElement('option');
    opt.value = tz;
    opt.textContent = tz.replace(/_/g, ' ') + '  (' + utcOffsetLabel(tz) + ')';
    sel.appendChild(opt);
  }
}

populateSelect(document.getElementById('rider-tz'));
populateSelect(document.getElementById('display-tz'));

document.getElementById('detected-tz-label').textContent = browserTz.replace(/_/g, ' ');

function updateTzMeta() {
  const tz = document.getElementById('rider-tz').value;
  document.getElementById('tz-abbrev-meta').textContent = 'LOCAL · ' + tzAbbrev(tz);
}
updateTzMeta();
document.getElementById('rider-tz').addEventListener('change', () => { updateTzMeta(); renderSlots(); renderOutput(); });

function updateDisplayTzAbbrev() {
  document.getElementById('display-tz-abbrev').textContent = tzAbbrev(document.getElementById('display-tz').value);
}
updateDisplayTzAbbrev();

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.mode').forEach(m => m.classList.toggle('active', m.id === 'mode-' + name));
}

// --- ENTER MODE ---

let slots = [];

function localToUtc(wallStr, tz) {
  if (!wallStr) return null;
  const [datePart, timePart] = wallStr.split('T');
  const [y, mo, d] = datePart.split('-').map(Number);
  const [h, mi] = (timePart || '00:00').split(':').map(Number);
  const utcGuess = Date.UTC(y, mo - 1, d, h, mi, 0);
  let ts = utcGuess;
  for (let i = 0; i < 3; i++) {
    const off = getUtcOffsetMs(tz, new Date(ts));
    ts = utcGuess - off;
  }
  return new Date(ts);
}

function fmtParts(date, tz) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false, weekday: 'short', month: 'short',
    day: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
  const m = {};
  for (const p of dtf.formatToParts(date)) m[p.type] = p.value;
  if (m.hour === '24') m.hour = '00';
  return m;
}

function fmtDay(date, tz) {
  const m = fmtParts(date, tz);
  return m.weekday + ' ' + m.month + ' ' + m.day;
}

function fmtTime(date, tz) {
  const m = fmtParts(date, tz);
  return m.hour + ':' + m.minute;
}

function durLabel(ms) {
  const mins = Math.round(ms / 60000);
  const h = Math.floor(mins / 60);
  const mm = mins % 60;
  if (h && mm) return h + 'H ' + mm + 'M';
  if (h) return h + 'H';
  return mm + 'M';
}

function dayKey(date, tz) {
  const dtf = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' });
  const m = {};
  for (const p of dtf.formatToParts(date)) m[p.type] = p.value;
  return m.year + '-' + m.month + '-' + m.day;
}

function dayLabelParts(date, tz) {
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'long', month: 'short', day: '2-digit', year: 'numeric' });
  const m = {};
  for (const p of dtf.formatToParts(date)) m[p.type] = p.value;
  return { dow: m.weekday, date: m.month + ' ' + m.day + ' ' + m.year };
}

function addSlot() {
  const errEl = document.getElementById('slot-error');
  errEl.innerHTML = '';

  const name = document.getElementById('rider-name').value.trim();
  if (!name) {
    errEl.innerHTML = '<div class="hint" style="color:var(--danger);margin-top:10px">Enter your rider name first.</div>';
    return;
  }

  const startStr = document.getElementById('slot-start').value;
  const endStr = document.getElementById('slot-end').value;
  if (!startStr || !endStr) {
    errEl.innerHTML = '<div class="hint" style="color:var(--danger);margin-top:10px">Set both a start and end time.</div>';
    return;
  }

  const tz = document.getElementById('rider-tz').value;
  const s = localToUtc(startStr, tz);
  const e = localToUtc(endStr, tz);
  if (e <= s) {
    errEl.innerHTML = '<div class="hint" style="color:var(--danger);margin-top:10px">End must be after start.</div>';
    return;
  }

  slots.push({ s: s.toISOString(), e: e.toISOString() });
  slots.sort((a, b) => new Date(a.s) - new Date(b.s));
  renderSlots();
  renderOutput();
}

function removeSlot(i) {
  slots.splice(i, 1);
  renderSlots();
  renderOutput();
}

function renderSlots() {
  const container = document.getElementById('slot-list');
  const tz = document.getElementById('rider-tz').value;
  document.getElementById('slot-count-meta').textContent = slots.length + ' ADDED · ' + tzAbbrev(tz);

  if (slots.length === 0) {
    container.innerHTML = '<div class="empty">No slots yet — add windows when you can ride.</div>';
    return;
  }

  container.innerHTML = '<div class="slot-list">' + slots.map((sl, i) => {
    const sd = new Date(sl.s), ed = new Date(sl.e);
    const day = fmtDay(sd, tz);
    const rng = fmtTime(sd, tz) + '–' + fmtTime(ed, tz);
    const dur = durLabel(ed - sd);
    return '<div class="slot"><div class="when">' +
      '<span class="day">' + escHtml(day) + '</span>  ' +
      '<span class="rng">' + rng + '</span>' +
      '<span class="dur">' + dur + '</span>' +
      '</div><button class="x" title="Remove" onclick="removeSlot(' + i + ')">&#10005;</button></div>';
  }).join('') + '</div>';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- URL ENCODING / SHARING ---

function toBase64Url(str) {
  return btoa(unescape(encodeURIComponent(str)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromBase64Url(b64) {
  const padded = b64.replace(/-/g, '+').replace(/_/g, '/');
  try { return decodeURIComponent(escape(atob(padded))); }
  catch(e) { return null; }
}

function encodeAvailability() {
  const name = document.getElementById('rider-name').value.trim();
  const tz = document.getElementById('rider-tz').value;
  if (!name || slots.length === 0) return null;
  const payload = { v: 1, name, tz, slots: slots.map(s => ({ s: s.s, e: s.e })) };
  return toBase64Url(JSON.stringify(payload));
}

function decodeAvailability(encoded) {
  const json = fromBase64Url(encoded);
  if (!json) return null;
  try {
    const obj = JSON.parse(json);
    if (!obj.name || !Array.isArray(obj.slots)) return null;
    return obj;
  } catch(e) { return null; }
}

function generateShareLink() {
  const encoded = encodeAvailability();
  if (!encoded) return;
  const url = location.origin + location.pathname + '#d=' + encoded;
  const urlEl = document.getElementById('share-url');
  urlEl.textContent = url;
  urlEl.classList.remove('placeholder');
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('share-btn');
    btn.textContent = '✓ Copied!';
    btn.style.background = 'var(--green)';
    btn.style.borderColor = 'var(--green)';
    setTimeout(() => {
      btn.innerHTML = '&#9656; Share Link';
      btn.style.background = '';
      btn.style.borderColor = '';
    }, 1600);
  });
}

function updateShareBtn() {
  const name = document.getElementById('rider-name').value.trim();
  const btn = document.getElementById('share-btn');
  const urlEl = document.getElementById('share-url');
  if (name && slots.length > 0) {
    btn.disabled = false;
  } else {
    btn.disabled = true;
    urlEl.textContent = 'Add your name and at least one slot to generate a share link';
    urlEl.classList.add('placeholder');
  }
}

function renderOutput() {
  updateShareBtn();
}

// --- LOAD FROM URL HASH ---

function loadFromHash() {
  const hash = location.hash;
  if (!hash || !hash.startsWith('#d=')) return false;
  const encoded = hash.slice(3);
  const data = decodeAvailability(encoded);
  if (!data) return false;
  // Load into merge mode as a pre-filled rider block
  switchTab('merge');
  const block = '-- AVAILABILITY BLOCK --\n' + JSON.stringify({
    name: data.name, tz: data.tz,
    slots: data.slots.map(s => ({ s: s.s, e: s.e }))
  }, null, 2);
  // Add to first empty block, or append
  let placed = false;
  for (let i = 0; i < riderBlocks.length; i++) {
    if (!riderBlocks[i].trim()) { riderBlocks[i] = block; placed = true; break; }
  }
  if (!placed) { riderBlocks.push(block); }
  renderRiderGrid();
  // Clear hash so refreshing doesn't re-add
  history.replaceState(null, '', location.pathname);
  return true;
}

// Save on name input too
document.getElementById('rider-name').addEventListener('input', () => { renderOutput(); });

// Initialize
loadFromHash();
renderSlots();
renderOutput();

function resetEnter() {
  document.getElementById('rider-name').value = '';
  document.getElementById('slot-start').value = '';
  document.getElementById('slot-end').value = '';
  document.getElementById('slot-error').innerHTML = '';
  document.getElementById('rider-tz').value = browserTz;
  updateTzMeta();
  slots = [];
  renderSlots();
  renderOutput();
}

// --- MERGE MODE ---

let riderBlocks = ['', ''];

function updateRiderParseStatus() {
  let valid = 0;
  riderBlocks.forEach(b => { if (parseBlock(b)) valid++; });
  const total = riderBlocks.length;
  document.getElementById('rider-parse-meta').textContent = valid + ' VALID / ' + total + ' TOTAL';
  const max = Math.max(2, valid);
  const slider = document.getElementById('threshold-slider');
  slider.max = max;
  if (parseInt(slider.value) < 2) slider.value = 2;
  document.getElementById('threshold-val').textContent = slider.value + ' / ' + max;
  document.getElementById('scale-max').textContent = 'ALL (' + max + ')';
  document.getElementById('find-btn').disabled = valid === 0;
}

function renderRiderGrid() {
  const grid = document.getElementById('riders-grid');
  grid.innerHTML = riderBlocks.map((b, i) => {
    const parsed = parseBlock(b);
    const empty = !b.trim();
    const statusCls = empty ? '' : (parsed ? ' ok' : ' err');
    const statusText = empty ? 'EMPTY' : (parsed ? parsed.slots.length + ' SLOTS' : 'INVALID');
    const nameText = parsed ? escHtml(parsed.name) : 'RIDER ' + (i + 1);
    const num = String(i + 1).padStart(2, '0');

    return '<div class="rider-card">' +
      '<div class="rc-head"><div class="name">' +
      '<span style="font-family:var(--mono);color:var(--muted-2)">' + num + '</span>' +
      nameText + '</div>' +
      '<div class="rc-toolbar"><span class="status-pill' + statusCls + '">' + statusText + '</span>' +
      (riderBlocks.length > 1 ? '<button class="rc-x" onclick="removeRiderBlock(' + i + ')" title="Remove rider">&#10005;</button>' : '') +
      '</div></div>' +
      '<textarea spellcheck="false" placeholder="-- AVAILABILITY BLOCK --&#10;{ paste rider payload here }" ' +
      'oninput="onRiderInput(' + i + ', this.value)">' + escHtml(b) + '</textarea></div>';
  }).join('');
  updateRiderParseStatus();
}

function onRiderInput(i, val) {
  riderBlocks[i] = val;
  updateRiderParseStatus();
  // update status pill for this card
  const cards = document.querySelectorAll('.rider-card');
  if (cards[i]) {
    const parsed = parseBlock(val);
    const empty = !val.trim();
    const pill = cards[i].querySelector('.status-pill');
    const nameEl = cards[i].querySelector('.name');
    pill.className = 'status-pill' + (empty ? '' : (parsed ? ' ok' : ' err'));
    pill.textContent = empty ? 'EMPTY' : (parsed ? parsed.slots.length + ' SLOTS' : 'INVALID');
    const num = String(i + 1).padStart(2, '0');
    nameEl.innerHTML = '<span style="font-family:var(--mono);color:var(--muted-2)">' + num + '</span>' +
      (parsed ? escHtml(parsed.name) : 'RIDER ' + (i + 1));
  }
}

function addRiderBlock() {
  riderBlocks.push('');
  renderRiderGrid();
}

function removeRiderBlock(i) {
  riderBlocks.splice(i, 1);
  renderRiderGrid();
}

function parseBlock(text) {
  if (!text || !text.trim()) return null;
  // Try to decode a share URL
  const trimmed = text.trim();
  const hashIdx = trimmed.indexOf('#d=');
  if (hashIdx !== -1) {
    const encoded = trimmed.slice(hashIdx + 3);
    const decoded = decodeAvailability(encoded);
    if (decoded) {
      const validSlots = [];
      for (const sl of (decoded.slots || [])) {
        const sKey = sl.s || sl.start, eKey = sl.e || sl.end;
        if (!sKey || !eKey) continue;
        const sd = new Date(sKey), ed = new Date(eKey);
        if (isNaN(sd) || isNaN(ed) || ed <= sd) continue;
        validSlots.push({ s: sd.toISOString(), e: ed.toISOString() });
      }
      if (validSlots.length) return { name: String(decoded.name), tz: decoded.tz || 'UTC', slots: validSlots };
    }
  }
  // Standard block parsing
  const cleaned = trimmed.split('\n').filter(l => !l.trim().startsWith('--')).join('\n').trim();
  let obj;
  try { obj = JSON.parse(cleaned); } catch(e) { return null; }
  if (!obj || typeof obj !== 'object') return null;
  if (!obj.name) return null;
  const slotArr = Array.isArray(obj.slots) ? obj.slots : [];
  const validSlots = [];
  for (const sl of slotArr) {
    const sKey = sl.s || sl.start;
    const eKey = sl.e || sl.end;
    if (!sKey || !eKey) continue;
    const sd = new Date(sKey), ed = new Date(eKey);
    if (isNaN(sd) || isNaN(ed) || ed <= sd) continue;
    validSlots.push({ s: sd.toISOString(), e: ed.toISOString() });
  }
  if (validSlots.length === 0) return null;
  return { name: String(obj.name), tz: obj.tz || 'UTC', slots: validSlots };
}

function findOverlaps() {
  const resultsDiv = document.getElementById('merge-results');
  const riders = [];
  riderBlocks.forEach(b => {
    const p = parseBlock(b);
    if (p) riders.push(p);
  });

  if (riders.length === 0) {
    resultsDiv.innerHTML = '<div class="spacer"></div><div class="no-results"><div class="big">No valid blocks</div><div class="small">Paste availability blocks above first.</div></div>';
    return;
  }

  const threshold = Math.min(parseInt(document.getElementById('threshold-slider').value), riders.length);
  const displayTz = document.getElementById('display-tz').value;

  let earliest = Infinity, latest = -Infinity;
  for (const r of riders) {
    for (const sl of r.slots) {
      const s = new Date(sl.s).getTime(), e = new Date(sl.e).getTime();
      if (s < earliest) earliest = s;
      if (e > latest) latest = e;
    }
  }

  const STEP = 15 * 60 * 1000;
  const windows = [];
  let current = null;

  for (let t = earliest; t < latest; t += STEP) {
    const tEnd = t + STEP;
    const available = [];
    for (const r of riders) {
      for (const sl of r.slots) {
        if (new Date(sl.s).getTime() <= t && new Date(sl.e).getTime() >= tEnd) {
          available.push(r.name);
          break;
        }
      }
    }

    if (available.length >= threshold) {
      const key = available.slice().sort().join('|');
      if (current && current.key === key && current.end === t) {
        current.end = tEnd;
      } else {
        if (current) windows.push(current);
        current = { start: t, end: tEnd, names: available, key };
      }
    } else {
      if (current) { windows.push(current); current = null; }
    }
  }
  if (current) windows.push(current);

  // build results header
  let html = '<div class="results">' +
    '<div class="sec-head" style="border:1px solid var(--line)">' +
    '<div class="lbl"><span class="dot" style="background:var(--green)"></span>Overlap Windows</div>' +
    '<div class="meta">&ge; ' + threshold + ' OF ' + riders.length + ' RIDERS · ' +
    windows.length + ' WINDOW' + (windows.length === 1 ? '' : 'S') + ' · ' + tzAbbrev(displayTz) + '</div></div>';

  html += '<div class="pnl" style="border-top:none;padding:18px">';

  if (windows.length === 0) {
    html += '<div class="no-results"><div class="big">No overlaps found</div>' +
      '<div class="small">Lower the minimum-riders threshold, or check that the pasted blocks share calendar dates.</div></div>';
  } else {
    const grouped = {};
    for (const w of windows) {
      const dk = dayKey(new Date(w.start), displayTz);
      if (!grouped[dk]) grouped[dk] = { label: dayLabelParts(new Date(w.start), displayTz), windows: [] };
      grouped[dk].windows.push(w);
    }

    for (const dk of Object.keys(grouped).sort()) {
      const g = grouped[dk];
      html += '<div class="day-group"><div class="day-head">' +
        '<span class="dow">' + escHtml(g.label.dow) + '</span>' +
        '<span class="date">' + escHtml(g.label.date) + '</span>' +
        '<span class="count">' + g.windows.length + ' WINDOW' + (g.windows.length === 1 ? '' : 'S') + '</span></div>';

      for (const w of g.windows) {
        const ts = fmtTime(new Date(w.start), displayTz);
        const te = fmtTime(new Date(w.end), displayTz);
        const dur = durLabel(w.end - w.start);
        const chips = w.names.map(n => '<span class="rider-chip">' + escHtml(n) + '</span>').join('');

        html += '<div class="overlap"><div class="time">' +
          '<span class="rng">' + ts + ' – ' + te + '</span>' +
          '<span class="dur">' + dur + ' WINDOW</span></div>' +
          '<div class="riders">' + chips + '</div>' +
          '<div class="cnt">' + w.names.length + ' RIDER' + (w.names.length === 1 ? '' : 'S') + '</div></div>';
      }
      html += '</div>';
    }
  }

  html += '</div></div>';
  resultsDiv.innerHTML = html;
}

// --- MERGE LOCAL STORAGE ---

function saveMergeToLS() {
  const data = {
    tz: document.getElementById('display-tz').value,
    threshold: document.getElementById('threshold-slider').value,
    blocks: riderBlocks
  };
  try { localStorage.setItem('ta_merge', JSON.stringify(data)); } catch(e) {}
}

function loadMergeFromLS() {
  try {
    const raw = localStorage.getItem('ta_merge');
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.tz) {
      const sel = document.getElementById('display-tz');
      if (Array.from(sel.options).some(o => o.value === data.tz)) {
        sel.value = data.tz;
        updateDisplayTzAbbrev();
      }
    }
    if (data.threshold) {
      document.getElementById('threshold-slider').value = data.threshold;
    }
    if (Array.isArray(data.blocks) && data.blocks.length > 0) {
      riderBlocks = data.blocks;
      return true;
    }
  } catch(e) {}
  return false;
}

loadMergeFromLS();
renderRiderGrid();

// Auto-save merge on changes
document.getElementById('display-tz').addEventListener('change', () => { updateDisplayTzAbbrev(); saveMergeToLS(); });
document.getElementById('threshold-slider').addEventListener('input', function() {
  const max = Math.max(2, parseInt(this.max));
  document.getElementById('threshold-val').textContent = this.value + ' / ' + max;
  saveMergeToLS();
});

// Patch rider input, add/remove to save
const _origOnRiderInput = onRiderInput;
onRiderInput = function(i, val) { _origOnRiderInput(i, val); saveMergeToLS(); };
const _origAddRiderBlock = addRiderBlock;
addRiderBlock = function() { _origAddRiderBlock(); saveMergeToLS(); };
const _origRemoveRiderBlock = removeRiderBlock;
removeRiderBlock = function(i) { _origRemoveRiderBlock(i); saveMergeToLS(); };

function resetMerge() {
  document.getElementById('display-tz').value = browserTz;
  updateDisplayTzAbbrev();
  document.getElementById('threshold-slider').value = 2;
  document.getElementById('merge-results').innerHTML = '';
  riderBlocks = ['', ''];
  renderRiderGrid();
  try { localStorage.removeItem('ta_merge'); } catch(e) {}
}
</script>
